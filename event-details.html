<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details - Spectrum 2025</title>
    <link rel="stylesheet" href="event-details.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        if (!localStorage.getItem('isLoggedIn')) {
            window.location.href = 'index.html';
        }
    </script>
    <!-- CHANGE 1: ADD NAVBAR CSS LINK -->
    <link rel="stylesheet" href="navbar.css">
    
    <style>
        /* Adjust body for navbar */
        body {
            padding-top: 80px; /* Add this for navbar space */
        }

        /* Adjust back container position */
        .back-container {
            margin-top: 20px; /* Add some spacing below navbar */
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="gradient-bg"></div>
    <div class="sparkle-overlay"></div>
    
    <!-- CHANGE 2: REPLACE THE ENTIRE NAVBAR SECTION -->
    <!-- NAVBAR HTML -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="home.html" class="logo">
                <div class="logo-icon">
                    <i class="fas fa-palette"></i>
                </div>
                <span class="logo-text">Spectrum 2025</span>
            </a>
            
            <button class="mobile-toggle" id="mobileToggle">
                <i class="fas fa-bars"></i>
            </button>
            
            <ul class="nav-menu" id="navMenu">
                <li class="nav-item">
                    <a href="home.html" class="nav-link home">
                        <i class="fas fa-home"></i>
                        <span>Home</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="events.html" class="nav-link events">
                        <i class="fas fa-calendar-alt"></i>
                        <span>Events</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="index.html" class="nav-link login">
                        <i class="fas fa-sign-in-alt"></i>
                        <span>Login</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="about.html" class="nav-link about">
                        <i class="fas fa-info-circle"></i>
                        <span>About</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="contact.html" class="nav-link contact">
                        <i class="fas fa-envelope"></i>
                        <span>Contact</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="dashboard.html" class="nav-link dashboard">
                        <i class="fas fa-tachometer-alt"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Back to Events Link -->
    <div class="back-container">
        <a href="events.html" class="back-link">
            <i class="fas fa-arrow-left"></i>
            Back to Events
        </a>
    </div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="content-grid">
                <!-- Event Details Section -->
                <section class="event-details" id="eventDetails">
                    <!-- Content will be loaded dynamically -->
                </section>

                <!-- Upcoming Events Sidebar -->
                <aside class="upcoming-events">
                    <div class="sidebar-header">
                        <h3>Upcoming Events</h3>
                        <i class="fas fa-bolt"></i>
                    </div>
                    <div class="events-list" id="upcomingEvents">
                        <!-- Events will be loaded dynamically -->
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <!-- CHANGE 3: ADD NAVBAR JS BEFORE YOUR PAGE-SPECIFIC JAVASCRIPT -->
    <script src="navbar.js"></script>

    <script src="event-details.js"></script>
</body>
</html>
