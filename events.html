<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - Spectrum 2025</title>
    <link rel="stylesheet" href="events.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        if (!localStorage.getItem('isLoggedIn')) {
            window.location.href = 'index.html';
        }
    </script>
    <!-- CHANGE 1: ADD NAVBAR CSS LINK -->
    <link rel="stylesheet" href="navbar.css">
    
    <style>
        /* Adjust body for navbar */
        body {
            padding-top: 80px; /* Add this for navbar space */
        }

        /* Ensure events section starts below navbar */
        .events-section {
            margin-top: 0;
        }

        /* Active state for events page */
        .nav-link.events {
            background: rgba(255, 255, 255, 0.5);
            border-color: #a3d9ff;
        }
    </style>
</head>
<body>
    <!-- Animated Gradient Background -->
    <div class="gradient-bg"></div>
    
    <!-- CHANGE 2: REPLACE THE ENTIRE NAVBAR SECTION -->
    <!-- NAVBAR HTML -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="home.html" class="logo">
                <div class="logo-icon">
                    <i class="fas fa-palette"></i>
                </div>
                <span class="logo-text">Spectrum 2025</span>
            </a>
            
            <button class="mobile-toggle" id="mobileToggle">
                <i class="fas fa-bars"></i>
            </button>
            
            <ul class="nav-menu" id="navMenu">
                <li class="nav-item">
                    <a href="home.html" class="nav-link home">
                        <i class="fas fa-home"></i>
                        <span>Home</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="events.html" class="nav-link events">
                        <i class="fas fa-calendar-alt"></i>
                        <span>Events</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="index.html" class="nav-link login">
                        <i class="fas fa-sign-in-alt"></i>
                        <span>Login</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="about.html" class="nav-link about">
                        <i class="fas fa-info-circle"></i>
                        <span>About</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="contact.html" class="nav-link contact">
                        <i class="fas fa-envelope"></i>
                        <span>Contact</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="dashboard.html" class="nav-link dashboard">
                        <i class="fas fa-tachometer-alt"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Events Section -->
    <section class="events-section">
        <div class="container">
            <!-- Section Title -->
            <div class="section-header">
                <h1 class="section-title">Events at Spectrum 2025 <span class="title-emoji">🎉</span></h1>
                <p class="section-subtitle">Discover amazing cultural, technical, and fun events</p>
            </div>

            <!-- Category Tabs -->
            <div class="category-tabs">
                <button class="tab-btn active" data-category="all">
                    <span class="tab-icon">🌟</span>
                    All Events
                </button>
                <button class="tab-btn" data-category="cultural">
                    <span class="tab-icon">🎤</span>
                    Cultural
                </button>
                <button class="tab-btn" data-category="technical">
                    <span class="tab-icon">💡</span>
                    Technical
                </button>
                <button class="tab-btn" data-category="fun">
                    <span class="tab-icon">🎮</span>
                    Fun & Games
                </button>
                <button class="tab-btn" data-category="workshops">
                    <span class="tab-icon">🎨</span>
                    Workshops
                </button>
            </div>

            <!-- Events Grid -->
            <div class="events-grid" id="eventsGrid">
                <!-- Events will be loaded dynamically -->
            </div>
        </div>
    </section>

    <!-- Confetti Container -->
    <div id="confetti-container"></div>

    <!-- CHANGE 3: ADD NAVBAR JS BEFORE YOUR PAGE-SPECIFIC JAVASCRIPT -->
    <script src="navbar.js"></script>

    <script src="events.js"></script>
</body>
</html>
