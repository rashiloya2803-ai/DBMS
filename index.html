<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Spectrum 2025</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CHANGE 1: ADD NAVBAR CSS LINK -->
    <link rel="stylesheet" href="navbar.css">
    
    <style>
        /* Adjust body for navbar */
        body {
            padding-top: 80px; /* Add this for navbar space */
        }

        /* Ensure login section starts below navbar */
        .login-section {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <!-- Same Background as Register Page -->
    <div class="gradient-bg"></div>
    <div class="floating-shapes"></div>

    <!-- CHANGE 2: REPLACE THE ENTIRE NAVBAR SECTION -->
    <!-- NAVBAR HTML -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="home.html" class="logo">
                <div class="logo-icon">
                    <i class="fas fa-palette"></i>
                </div>
                <span class="logo-text">Spectrum 2025</span>
            </a>
            
            <button class="mobile-toggle" id="mobileToggle">
                <i class="fas fa-bars"></i>
            </button>
            
            <ul class="nav-menu" id="navMenu">
                <li class="nav-item">
                    <a href="home.html" class="nav-link home">
                        <i class="fas fa-home"></i>
                        <span>Home</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="events.html" class="nav-link events">
                        <i class="fas fa-calendar-alt"></i>
                        <span>Events</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="register.html" class="nav-link register">
                        <i class="fas fa-user-plus"></i>
                        <span>Register</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="index.html" class="nav-link login">
                        <i class="fas fa-sign-in-alt"></i>
                        <span>Login</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="about.html" class="nav-link about">
                        <i class="fas fa-info-circle"></i>
                        <span>About</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="contact.html" class="nav-link contact">
                        <i class="fas fa-envelope"></i>
                        <span>Contact</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="dashboard.html" class="nav-link dashboard">
                        <i class="fas fa-tachometer-alt"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Login Section -->
    <section class="login-section">
        <div class="login-container">
            <!-- Glass Card -->
            <div class="glass-card">
                <div class="card-header">
    <h1 class="card-title">Welcome to Spectrum 2025</h1>
    <p class="card-subtitle">Sign in to register for amazing events</p>
</div>

                <form class="login-form">
                    <div class="form-row">
                        <div class="input-group">
                            <div class="input-icon">
                                <i class="fas fa-envelope"></i>
                            </div>
                            <input type="email" class="form-input" placeholder="Email Address" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="input-group">
                            <div class="input-icon">
                                <i class="fas fa-lock"></i>
                            </div>
                            <input type="password" class="form-input" placeholder="Password" required>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox">
                            <span class="checkmark"></span>
                            Remember me
                        </label>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>

                    <button type="submit" class="login-btn">
                        <span class="btn-text">Enter Spectrum</span>
                        <span class="btn-sparkle">✨</span>
                        <div class="btn-glow"></div>
                    </button>
                    
                </form>
            </div>
        </div>
    </section>

    <!-- CHANGE 3: ADD NAVBAR JS BEFORE YOUR PAGE-SPECIFIC JAVASCRIPT -->
    <script src="navbar.js"></script>

    <script src="login.js"></script>
</body>
</html>
